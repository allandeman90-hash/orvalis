name: Deploy Orvalis Preview

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install legacy dependencies
        run: npm ci

      - name: Build legacy Orvalis
        run: npm run build:prod

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Typecheck engine
        working-directory: engine
        run: npm run typecheck

      - name: Build engine + bundled legacy page
        working-directory: engine
        run: npm run build

      - name: Add GitHub Pages marker
        run: touch engine/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
