name: V1.3 Equipment Appearance Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-3-validation.yml'
      - 'engine/src/character/appearanceCollection.ts'
      - 'engine/src/character/productionContract.ts'
      - 'engine/src/character/index.ts'
      - 'engine/tests/character/appearanceCollection.test.ts'
      - 'engine/tests/character/productionContract.test.ts'
      - 'docs/EQUIPMENT_APPEARANCE_V1_3.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-3-equipment-appearance-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        run: npm ci

      - name: Typecheck engine
        run: npm run typecheck

      - name: Lint V1.3 files
        run: npx eslint src/character/appearanceCollection.ts src/character/productionContract.ts src/character/index.ts tests/character/appearanceCollection.test.ts tests/character/productionContract.test.ts

      - name: Run appearance contract tests
        run: npx vitest run tests/character/productionContract.test.ts tests/character/appearanceCollection.test.ts

      - name: Build engine
        run: npm run build
