name: V1.1 External Model Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-1-validation.yml'
      - 'engine/src/model/externalAsset.ts'
      - 'engine/src/model/index.ts'
      - 'engine/public/assets/models/v1-1-crystal.orvmodel.json'
      - 'engine/tests/assets/modelAsset.integration.test.ts'
      - 'docs/MODEL_ASSET_INGESTION_V1_1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        run: npm ci

      - name: Typecheck engine
        run: npm run typecheck

      - name: Lint V1.1 files
        run: npx eslint src/model/externalAsset.ts tests/assets/modelAsset.integration.test.ts

      - name: Run V1.1 ingestion test
        run: npx vitest run tests/assets/modelAsset.integration.test.ts

      - name: Build engine
        run: npm run build

      - name: Install Chromium for model smokes
        run: npx playwright install --with-deps chromium

      - name: Model smokes — WebGL2 + WebGPU
        run: npm run smoke:model -- --no-build
