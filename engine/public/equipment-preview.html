<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orvalis — Equipment Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090d13;color:#eef3f8;font:14px system-ui,Segoe UI,Arial}canvas{width:100%;height:100%;display:block}#ui{position:fixed;left:14px;top:14px;z-index:5;max-width:min(620px,calc(100vw - 28px));padding:12px;border:1px solid #334154;border-radius:10px;background:#0d131be8;backdrop-filter:blur(8px)}#ui b{font-size:16px}#status{margin-top:5px;color:#aab8c8}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}button,label{border:1px solid #40516a;background:#17212e;color:#edf3fa;border-radius:7px;padding:6px 9px;cursor:pointer}button.active{background:#2a405d;outline:1px solid #8da6c4}input[type=file]{display:none}.warn{color:#ffcc7a}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><canvas id="c"></canvas><div id="ui"><b>Orvalis — Human rigged + plastron</b><div id="status">Chargement du personnage…</div><div class="row"><button id="equip" class="active">Plastron ON</button><button id="front">Face</button><button id="back">Dos</button><button id="side">Profil</button><label>Charger GLB<input id="file" type="file" accept=".glb,model/gltf-binary"></label></div><div id="clips" class="row"></div></div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#c'),status=document.querySelector('#status'),clipsEl=document.querySelector('#clips');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x090d13);const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xd7e6f6,0x30241d,2));const key=new THREE.DirectionalLight(0xffddbd,3);key.position.set(-3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0x7da3d8,1.2);rim.position.set(4,3,-4);scene.add(rim);const camera=new THREE.PerspectiveCamera(34,1,.02,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=1.7;controls.maxDistance=7;const loader=new GLTFLoader();let root=null,mixer=null,action=null,armor=null,chestBone=null,bindInv=new THREE.Matrix4(),armorBind=new THREE.Matrix4(),equipped=true;
function mat(c,metal=.15){return new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:.72,flatShading:false});}
function buildArmor(){const g=new THREE.Group();g.name='OrvalisChestplate';const steel=mat(0x667487,.18),dark=mat(0x3b4654,.2),gold=mat(0xb58936,.22),blue=mat(0x263e61,.08);const breast=new THREE.Mesh(new THREE.SphereGeometry(.33,14,9,0,Math.PI*2,0,Math.PI*.72),steel);breast.scale.set(1.05,.72,.34);breast.position.set(0,1.39,.215);breast.rotation.x=Math.PI/2;g.add(breast);const lower=new THREE.Mesh(new THREE.CylinderGeometry(.235,.19,.22,8,1,false),dark);lower.scale.z=.55;lower.position.set(0,1.14,.12);g.add(lower);const inset=new THREE.Mesh(new THREE.BoxGeometry(.15,.28,.035),blue);inset.position.set(0,1.30,.285);g.add(inset);const collar=new THREE.Mesh(new THREE.TorusGeometry(.19,.025,6,18,Math.PI),gold);collar.position.set(0,1.54,.225);collar.rotation.z=Math.PI;g.add(collar);const trim=new THREE.Mesh(new THREE.BoxGeometry(.38,.035,.035),gold);trim.position.set(0,1.065,.20);g.add(trim);for(const s of[-1,1]){const side=new THREE.Mesh(new THREE.BoxGeometry(.075,.22,.075),steel);side.position.set(s*.25,1.31,.17);side.rotation.z=s*.12;g.add(side);}scene.add(g);return g;}
function fit(){const b=new THREE.Box3().setFromObject(root),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);controls.target.set(c.x,b.min.y+s.y*.53,c.z);camera.position.set(c.x,b.min.y+s.y*.53,c.z+Math.max(2.6,s.y*1.55));controls.update();}
function view(x,z){const b=new THREE.Box3().setFromObject(root),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);const d=Math.max(2.6,s.y*1.55);camera.position.set(c.x+x*d,b.min.y+s.y*.53,c.z+z*d);controls.target.set(c.x,b.min.y+s.y*.53,c.z);controls.update();}
function play(name){if(!mixer)return;if(action)action.fadeOut(.15);const clip=THREE.AnimationClip.findByName(root.userData.animations,name);if(!clip)return;action=mixer.clipAction(clip);action.reset().fadeIn(.15).play();document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===name));status.textContent='Animation : '+name;}
function install(gltf){if(root)scene.remove(root);if(armor)scene.remove(armor);root=gltf.scene;root.userData.animations=gltf.animations;scene.add(root);root.updateMatrixWorld(true);chestBone=root.getObjectByName('Spine')||root.getObjectByName('Spine01')||root.getObjectByName('Spine02');armor=buildArmor();armor.visible=equipped;if(chestBone){chestBone.updateMatrixWorld(true);bindInv.copy(chestBone.matrixWorld).invert();armorBind.copy(armor.matrix);}mixer=new THREE.AnimationMixer(root);clipsEl.innerHTML='';for(const clip of gltf.animations){const b=document.createElement('button');b.textContent=clip.name;b.dataset.clip=clip.name;b.onclick=()=>play(clip.name);clipsEl.appendChild(b);}fit();const preferred=['idle','walk_forward','run_forward','combat_idle'];play(preferred.find(n=>gltf.animations.some(c=>c.name===n))||gltf.animations[0]?.name);status.classList.remove('warn');}
function loadURL(url){loader.load(url,install,undefined,e=>{console.warn(e);status.innerHTML='<span class="warn">GLB pas encore publié dans le repo. Clique « Charger GLB » et choisis orvalis-human-animation-pack.glb.</span>';});}
loadURL('./assets/orvalis-human-animation-pack.glb');document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);loader.load(u,g=>{install(g);URL.revokeObjectURL(u);});};document.querySelector('#equip').onclick=e=>{equipped=!equipped;if(armor)armor.visible=equipped;e.currentTarget.classList.toggle('active',equipped);e.currentTarget.textContent='Plastron '+(equipped?'ON':'OFF');};document.querySelector('#front').onclick=()=>view(0,1);document.querySelector('#back').onclick=()=>view(0,-1);document.querySelector('#side').onclick=()=>view(1,0);
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();mixer?.update(dt);if(armor&&chestBone){root.updateMatrixWorld(true);const delta=new THREE.Matrix4().multiplyMatrices(chestBone.matrixWorld,bindInv);armor.matrixAutoUpdate=false;armor.matrix.copy(delta).multiply(armorBind);armor.matrixWorldNeedsUpdate=true;}controls.update();renderer.render(scene,camera);});function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
</script></body></html>
