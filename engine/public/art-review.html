<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orvalis — Art Review</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08100e;color:#eef5ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 35%,#24382f 0,#101915 42%,#080d0b 100%)}#game{display:block;width:100%;height:100%}#panel{position:fixed;left:16px;top:16px;width:min(420px,calc(100vw - 32px));padding:14px;border:1px solid #52645766;border-radius:14px;background:#0b1310e8;backdrop-filter:blur(12px);box-shadow:0 16px 50px #0008}#panel h1{font-size:18px;margin:0 0 4px}#panel p{margin:0;color:#a9b9ad;font-size:12px;line-height:1.45}#toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #526457;background:#15211b;color:#eef5ef;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600}button:hover{background:#1e3027}button.active{background:#395141;border-color:#79977e}#assets{display:grid;gap:7px;margin-top:12px}.asset{padding:9px 10px;border:1px solid #36463b;border-radius:9px;background:#101a16;cursor:pointer}.asset:hover,.asset.active{border-color:#79977e;background:#19271f}.asset.failed{border-color:#9b4949;background:#291717}.asset b{display:block;font-size:13px}.asset span{display:block;color:#91a497;font-size:11px;margin-top:2px}#status{position:fixed;right:16px;bottom:16px;padding:8px 10px;border-radius:9px;background:#0b1310e8;border:1px solid #52645755;color:#b8c7bc;font-size:12px;max-width:min(560px,calc(100vw - 32px))}.ok{color:#aee6ba}.err{color:#ff9b9b;border-color:#9b4949!important}#credit{position:fixed;left:16px;bottom:16px;max-width:min(680px,calc(100vw - 32px));font-size:11px;color:#819187;background:#08100eaa;padding:6px 8px;border-radius:7px}@media(max-width:760px){#panel{width:calc(100vw - 32px);max-height:52vh;overflow:auto}#credit{display:none}}
</style>
<script>window.setTimeout(()=>{if(!window.__orvalisArtReviewBooted){document.body.dataset.state='error';const s=document.getElementById('status');if(s){s.className='err';s.textContent='ERREUR · les modules 3D ne se sont pas chargés (CDN/import).';}}},6500);</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body data-state="loading">
<canvas id="game"></canvas>
<section id="panel"><h1>Orvalis · Art Review A0</h1><p>Un seul candidat est cadré en gros plan par défaut. Une erreur de chargement est maintenant fatale et visible.</p><div id="toolbar"><button id="all">Tout voir</button><button id="front">Face</button><button id="oblique" class="active">3/4</button><button id="spin" class="active">Rotation lente</button><button id="light">Lumière douce</button></div><div id="assets"></div></section>
<div id="credit">Candidats : Quaternius / Kay Lousberg · CC0 · provenance enregistrée avant intégration.</div><div id="status">Chargement du registre…</div>
<script type="module">
window.__orvalisArtReviewBooted=true;
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#game'),status=document.querySelector('#status'),list=document.querySelector('#assets');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0x0b1310);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0b1310,10,26);const camera=new THREE.PerspectiveCamera(32,1,.03,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=.5;controls.maxDistance=30;
const hemi=new THREE.HemisphereLight(0xd7e7da,0x3d2d21,1.8);scene.add(hemi);const key=new THREE.DirectionalLight(0xffe0bd,3.4);key.position.set(-7,10,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0x7697a7,1.15);rim.position.set(8,5,-8);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({color:0x304336,roughness:1,metalness:0}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(22,22,0x536a59,0x314239);grid.position.y=.004;scene.add(grid);
const loader=new GLTFLoader(),loaded=[];let selected=null,spinning=true,softLight=true;
function materialPass(root){root.traverse(node=>{if(!(node.isMesh||node.isSkinnedMesh))return;node.castShadow=true;node.receiveShadow=true;const src=Array.isArray(node.material)?node.material:[node.material];const mats=src.map(source=>{const m=source.clone();if('metalness'in m)m.metalness=0;if('roughness'in m)m.roughness=Math.max(.78,m.roughness??.78);m.side=THREE.DoubleSide;if(m.transparent&&m.alphaTest===0)m.alphaTest=.18;m.needsUpdate=true;return m});node.material=mats.length===1?mats[0]:mats;});}
function normalize(root,targetHeight){root.updateMatrixWorld(true);let box=new THREE.Box3().setFromObject(root),size=new THREE.Vector3();box.getSize(size);if(!Number.isFinite(size.y)||size.y<=0)throw new Error('bounding box invalide');const scale=targetHeight/size.y;root.scale.multiplyScalar(scale);root.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(root);root.position.y-=box.min.y;root.updateMatrixWorld(true);}
function fit(objects){if(!objects.length)return;const box=new THREE.Box3();objects.forEach(o=>box.expandByObject(o));const size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);const span=Math.max(size.x,size.y,size.z,.75);controls.target.set(center.x,Math.max(.35,center.y),center.z);camera.position.set(center.x+span*.72,center.y+span*.32,center.z+span*1.05);camera.near=.02;camera.far=Math.max(40,span*8);camera.updateProjectionMatrix();controls.update();}
function showOnly(id){selected=id;for(const item of loaded)item.root.visible=id===null||item.meta.id===id;document.querySelector('#all').classList.toggle('active',id===null);document.querySelectorAll('.asset').forEach(el=>el.classList.toggle('active',el.dataset.id===id));const objects=id===null?loaded.map(x=>x.root):loaded.filter(x=>x.meta.id===id).map(x=>x.root);fit(objects);}
function card(meta){const el=document.createElement('div');el.className='asset';el.dataset.id=meta.id;el.innerHTML=`<b>${meta.label}</b><span>${meta.author} · ${meta.license} · ${meta.category}</span>`;el.onclick=()=>{if(loaded.some(x=>x.meta.id===meta.id))showOnly(meta.id)};list.appendChild(el);}
async function boot(){const r=await fetch('./assets/art-review-registry.json',{cache:'no-store'});if(!r.ok)throw new Error(`registre HTTP ${r.status}`);const registry=await r.json();registry.assets.forEach(card);let failures=0;for(let i=0;i<registry.assets.length;i++){const meta=registry.assets[i];status.textContent=`Chargement ${i+1}/${registry.assets.length} · ${meta.label}`;try{const gltf=await loader.loadAsync(meta.reviewUrl);const root=gltf.scene;root.name=meta.id;materialPass(root);normalize(root,meta.reviewHeight??2.4);root.position.set(0,0,0);root.userData.baseX=0;scene.add(root);loaded.push({meta,root});root.visible=false;}catch(error){failures++;console.error(`[art-review] ${meta.id}`,error);const failed=document.querySelector(`.asset[data-id="${meta.id}"]`);failed?.classList.add('failed');failed?.querySelector('span')?.append(` · ÉCHEC`);}}
if(loaded.length===0)throw new Error(`0/${registry.assets.length} modèles chargés`);showOnly(loaded[0].meta.id);document.body.dataset.state=failures?'partial':'ready';document.body.dataset.loaded=String(loaded.length);document.body.dataset.failed=String(failures);status.className=failures?'err':'ok';status.textContent=`${loaded.length}/${registry.assets.length} chargés${failures?` · ${failures} échec(s)`:''} · ${loaded[0].meta.label} affiché en gros plan`;window.__orvalisArtReview={loaded:()=>loaded.length,failed:()=>failures,selected:()=>selected};}
function view(angle){const target=controls.target.clone(),distance=camera.position.distanceTo(target);camera.position.set(target.x+Math.sin(angle)*distance*.92,target.y+distance*.22,target.z+Math.cos(angle)*distance*.92);controls.update();}
document.querySelector('#all').onclick=()=>showOnly(null);document.querySelector('#front').onclick=()=>view(0);document.querySelector('#oblique').onclick=()=>view(Math.PI/4);document.querySelector('#spin').onclick=()=>{spinning=!spinning;document.querySelector('#spin').classList.toggle('active',spinning)};document.querySelector('#light').onclick=()=>{softLight=!softLight;hemi.intensity=softLight?1.8:.9;key.intensity=softLight?3.4:4.6;rim.intensity=softLight?1.15:.45;document.querySelector('#light').textContent=softLight?'Lumière douce':'Lumière dure'};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(spinning){for(const item of loaded)if(item.root.visible)item.root.rotation.y+=dt*.16;}controls.update();renderer.render(scene,camera);});
boot().catch(error=>{console.error(error);document.body.dataset.state='error';status.className='err';status.textContent=`ERREUR ART REVIEW · ${error.message}`});
</script></body></html>
