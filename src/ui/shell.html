<canvas id="game" aria-label="Monde d'Orvalis"></canvas>
<div id="ui">
  <div id="nameplates"></div>
  <div id="floaters"></div>
  <div id="hud" hidden>
    <div id="leftcol">
      <div id="unitframe"></div>
      <div id="petframe" hidden></div>
      <div id="party"></div>
    </div>
    <div id="targetframe" hidden></div>
    <div id="minimapbox"></div>
    <div id="tracker"></div>
    <div id="eventbox"></div>
    <div id="bottom">
      <div id="castbar" hidden><div class="fill"></div><span class="lbl"></span><span class="tm"></span></div>
      <div id="xpbar"><div class="fill"></div><span class="lbl"></span></div>
      <div id="actionbar"></div>
    </div>
    <div id="chat"></div>
    <div id="menubar"></div>
    <div id="lootfeed"></div>
    <div id="announce"></div>
    <div id="errors"></div>
    <div id="zonebanner"></div>
    <div id="windows"></div>
    <div id="death" hidden></div>
    <div id="prompt" hidden></div>
  </div>
  <div id="title" hidden></div>
  <div id="loading"><div class="ld-logo">Orvalis</div><div class="ld-sub">Forge du monde…</div><div class="ld-bar"><div></div></div></div>
  <div id="tooltip" hidden></div>
</div>
